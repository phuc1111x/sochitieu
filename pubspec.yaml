name: sochitieu
description: "Sổ chi tiêu cá nhân – offline, sao lưu Google Drive."
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
